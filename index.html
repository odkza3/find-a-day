<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>約時間 · Find a Day</title>
<meta name="description" content="Pick the days you are free and find the day that suits the most people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F2F2; --card:#ffffff; --ink:#111111; --muted:#6e6e6e; --line:#e2e2e2;
    --accent:#111111; --accent-ink:#ffffff; --picked:#888888; --danger:#9a2f2f;
    --radius:14px;
    --font:"Avenir Next","Avenir","Nunito Sans","Noto Sans TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  [hidden]{display:none !important}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{min-width:0;flex:1 1 420px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:4px 0 0;word-break:break-word}
  .details{margin:8px 0 0;color:#333;font-size:15px;line-height:1.55;white-space:pre-wrap;max-width:680px;word-break:break-word}
  .meta{margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px}
  .pill b{font-weight:600}
  .pill button{border:none;background:#ececec;border-radius:999px;padding:4px 10px;font-size:13px}
  .hbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px}
  .hbtn:hover{background:#efefef}
  .hbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hbtn.dark:hover{background:#333}
  .badge{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;text-transform:uppercase;vertical-align:middle}
  .status{font-size:12px;color:var(--muted);min-width:60px;text-align:right}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  @media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .notice{background:#fff;border:1px solid #d6d6d6;border-left:4px solid #111;color:#111;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
  .notice.show{display:flex}

  .cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .cal-top h2{margin:0;font-weight:600;font-size:24px;letter-spacing:-.01em}
  .nav{display:flex;gap:6px}
  .nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px}
  .nav button:hover{background:#efefef}
  .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;user-select:none;-webkit-user-select:none}
  .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
  .day{position:relative;min-width:0;overflow:hidden;aspect-ratio:1/0.92;min-height:62px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation}
  .day:hover{box-shadow:0 0 0 2px #bdbdbd inset}
  .day .num{font-size:14px;font-weight:600}
  .day .bottom{display:flex;flex-direction:column;gap:4px}
  .day .cnt{font-size:12px;font-weight:600;color:var(--muted);line-height:1}
  .dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
  .dots i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;display:block}
  .dots em{font-style:normal;font-size:10px;font-weight:700;line-height:12px}
  .day.out{opacity:.35}
  .day.past{opacity:.35;cursor:not-allowed}
  .day.today .num{background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;display:inline-block}
  .day.mine{background:var(--picked);border-color:var(--picked);color:#fff}
  .day.mine .cnt{color:rgba(255,255,255,.85)}
  .day.mine::after{content:"✓";position:absolute;top:5px;right:8px;font-size:13px;font-weight:700;color:#fff}
  .day.mine.today .num{background:#fff;color:var(--ink)}
  .day.focus{outline:3px solid var(--ink);outline-offset:1px}
  .day.full .cnt{color:var(--ink)}
  .day.full .cnt::before{content:"★ "}
  @media (max-width:600px){.wrap{padding:16px 12px 40px}.card{padding:14px}.grid{gap:4px}.dots i{width:7px;height:7px}.dots{gap:2px}.day{padding:4px 5px;min-height:54px;aspect-ratio:auto;border-radius:9px}.day .num{font-size:13px}.day .cnt{font-size:10px}.day.mine::after{top:3px;right:5px;font-size:11px}h1{font-size:28px}}
  .legend{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .sw{width:16px;height:16px;border-radius:4px;background:var(--picked);border:1px solid var(--picked);display:inline-block}
  .sw-dot{width:10px;height:10px;border-radius:50%;background:#BAE1FF;display:inline-block;margin-left:10px}
  .cal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px}
  .btn:hover{background:#efefef}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.danger{color:var(--danger)}
  .icon-btn{display:inline-flex;align-items:center;gap:6px}
  .cal-actions{align-items:center}
  .submit-btn{margin-left:auto;background:#888888;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600}
  .submit-btn:hover:not(:disabled){background:#777}
  .submit-btn:disabled{opacity:.4;cursor:default}
  .submit-btn.done{opacity:1}

  aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
  @media (max-width:900px){aside{position:static}}
  aside h3{margin:0 0 10px;font-size:15px;font-weight:700}
  .size-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{border:none;background:#efefef;width:34px;height:34px;font-size:18px}
  .stepper input{width:48px;border:none;text-align:center;font-weight:700;font-size:16px;outline:none;-moz-appearance:textfield;background:#fff}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .size-pill{padding:4px 5px 4px 14px;gap:10px}
  .mini-stepper{display:inline-flex;align-items:center;background:#efefef;border-radius:999px;overflow:hidden}
  .pill .mini-stepper button{background:transparent;border:none;border-radius:999px;width:26px;height:26px;padding:0;font-size:16px;line-height:1}
  .pill .mini-stepper button:hover{background:#e0e0e0}
  .mini-stepper input{width:32px;border:none;background:transparent;text-align:center;font-weight:700;font-size:14px;outline:none;-moz-appearance:textfield}
  .mini-stepper input::-webkit-outer-spin-button,.mini-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .h3-sub{font-weight:400;color:var(--muted);font-size:13px}
  .progress{height:8px;background:#e6e6e6;border-radius:99px;overflow:hidden;margin-top:12px}
  .progress div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .rank li button{width:100%;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-align:left}
  .rank li button:hover,.rank li button.sel{border-color:var(--ink);background:#f6f6f6}
  .rank .pos{font-weight:700;color:var(--muted);font-size:13px;text-align:center}
  .rank li:first-child .pos{color:var(--ink)}
  .rank .date{font-weight:600;font-size:14px}
  .rank .bar{height:5px;background:#e6e6e6;border-radius:9px;margin-top:5px;overflow:hidden}
  .rank .bar i{display:block;height:100%;background:var(--accent)}
  .rank .n{font-weight:700;font-size:14px;white-space:nowrap}
  .rank .n small{color:var(--muted);font-weight:500}
  .empty{font-size:14px;color:var(--muted);line-height:1.5}
  .names{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px 4px 4px;border-radius:999px;background:#efefef;border:none}
  .chip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#111;font-size:11px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .chip.off{opacity:.45}
  .chip.me{background:#dcdcdc}
  .detail-h{font-weight:700;font-size:15px;margin-bottom:8px}
  .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px;font-weight:600}

  .modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);margin:auto}
  .modal h2{font-weight:700;font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
  .modal p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field label small{color:var(--muted);font-weight:400}
  .modal input,.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;outline:none;background:#fff}
  .modal textarea{resize:vertical;min-height:96px;line-height:1.5}
  .modal input:focus,.modal textarea:focus{border-color:var(--ink)}
  .modal .stepper input{border:none;border-radius:0;padding:0;width:56px}
  .modal-actions{display:flex;gap:10px;margin-top:6px}
  .primary{flex:1;border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px;font-size:16px;font-weight:600}
  .primary:disabled{opacity:.5;cursor:default}
  .secondary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:16px}
  .form-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
  .existing{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="kicker" data-t="kicker"></div>
      <h1 id="titleText"></h1>
      <p class="details" id="detailsText" hidden></p>
      <div class="meta" id="metaLine" hidden>
        <span id="organiser"></span>
        <button class="hbtn dark" id="editBtn" data-t="editEvent" hidden></button>
      </div>
    </div>
    <div class="head-right">
      <span class="status" id="status"></span>
      <span class="pill size-pill" id="sizePill" hidden>
        <span data-t="groupSize"></span>
        <span class="mini-stepper" id="stepper">
          <button id="minus" aria-label="Fewer">−</button>
          <input id="size" type="number" min="2" max="100" inputmode="numeric" aria-label="Group size">
          <button id="plus" aria-label="More">+</button>
        </span>
        <b id="sizeStatic"></b>
      </span>
      <button class="hbtn" id="copyBtn" data-t="copyLink" hidden></button>
      <button class="hbtn" id="newBtn" data-t="newEvent"></button>
      <button class="hbtn" id="langBtn"></button>
      <span class="pill" id="mePill" hidden><span><span data-t="hi"></span> <b id="meName"></b> <span class="badge" id="adminBadge" data-t="admin" hidden></span></span><button id="switchBtn" data-t="switch"></button></span>
    </div>
  </header>

  <div class="notice" id="notice"><span id="noticeText"></span><button class="hbtn dark" id="noticeBtn" hidden></button></div>

  <div class="layout">
    <section class="card">
      <div class="cal-top">
        <h2 id="monthLabel"></h2>
        <div class="nav">
          <button id="prev" aria-label="Previous month">‹</button>
          <button id="todayBtn" data-t="today"></button>
          <button id="next" aria-label="Next month">›</button>
        </div>
      </div>
      <p class="hint" data-t="tapHint"></p>
      <div class="grid" id="dow"></div>
      <div class="grid" id="grid" style="margin-top:6px"></div>
      <div class="legend">
        <span class="sw"></span><span data-t="yours"></span>
        <span class="sw-dot"></span><span data-t="dotsMean"></span>
      </div>
      <div class="cal-actions">
        <button class="btn icon-btn" id="clearBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg><span data-t="clearMine"></span></button>
        <button class="btn danger" id="removeBtn" data-t="removeMe"></button>
        <button class="submit-btn" id="submitBtn" data-t="submit" disabled></button>
      </div>
    </section>

    <aside>

      <div class="card">
        <h3 data-t="bestDays"></h3>
        <ul class="rank" id="rank"></ul>
      </div>

      <div class="card" id="detailCard">
        <h3 data-t="dayDetail"></h3>
        <div id="detail"></div>
      </div>

      <div class="card">
        <h3><span data-t="whosIn"></span> <span class="h3-sub" id="responded"></span></h3>
        <div class="names" id="people"></div>
      </div>
    </aside>
  </div>
</div>

<!-- Create / edit event -->
<div class="modal-bg" id="eventModal">
  <form class="modal" id="eventForm" novalidate>
    <h2 id="evHeading"></h2>
    <p id="evHint"></p>
    <div class="field" id="evNameField">
      <label for="evAdmin" data-t="yourName"></label>
      <input id="evAdmin" maxlength="24" autocomplete="name">
    </div>
    <div class="field">
      <label for="evTitle" data-t="eventName"></label>
      <input id="evTitle" maxlength="60">
    </div>
    <div class="field">
      <label for="evDetails"><span data-t="eventDetails"></span> <small data-t="optional"></small></label>
      <textarea id="evDetails" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label data-t="groupSize"></label>
      <div class="stepper" style="display:inline-flex">
        <button type="button" id="evMinus" aria-label="Fewer">−</button>
        <input id="evSize" type="number" min="2" max="100" inputmode="numeric" aria-label="Group size">
        <button type="button" id="evPlus" aria-label="More">+</button>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="evCancel" data-t="cancel"></button>
      <button class="primary" id="evSubmit" type="submit"></button>
    </div>
    <div class="form-err" id="evErr"></div>
  </form>
</div>

<!-- Join with your name -->
<div class="modal-bg" id="nameModal">
  <form class="modal" id="nameForm">
    <h2 data-t="askName"></h2>
    <p data-t="askHint"></p>
    <input id="nameInput" maxlength="24" autocomplete="name" required>
    <div class="modal-actions" style="margin-top:14px">
      <button class="primary" type="submit" data-t="join"></button>
    </div>
    <div class="existing" id="existingWrap" hidden>
      <div class="lbl" data-t="orPick"></div>
      <div class="names" id="existing"></div>
    </div>
  </form>
</div>

<script type="module">
let initializeApp, getFirestore, doc, collection, setDoc, updateDoc, deleteDoc, onSnapshot;
{
  // ---------- i18n ----------

      editTitle:"修改活動", editHint:"修改後組入面所有人都會見到。",
      yourName:"你嘅名", eventName:"活動名稱", eventDetails:"活動詳情", optional:"（可留空）",
      detailsPh:"例如：晚上 7 點食飯，中環附近，每人預算約 $300。",
      titlePh:"例如：聖誕飯", namePh:"例如：阿明",
      create:"建立活動", creating:"建立中…", save:"儲存", cancel:"取消",
      editEvent:"修改活動", admin:"搞手", organisedBy:n=>`搞手：${n}`,
      needName:"請輸入你嘅名。", needTitle:"請輸入活動名稱。",
      createFail:"建立唔到活動，請檢查網絡再試。",
      notFound:"搵唔到呢個活動。請檢查連結，或者建立新活動。",
      createNew:"建立新活動"
    }
  };
  const ls = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  let lang = ls.get("yt-lang") || ((navigator.language||"").toLowerCase().startsWith("zh") ? "zh" : "en");
  const t = (k,...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };
  const locale = () => lang === "zh" ? "zh-HK" : "en-GB";

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2,"0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
  const clampSize = n => Math.max(2, Math.min(100, Math.round(Number(n)||2)));
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = keyOf(today);
  const newEventId = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => (b % 36).toString(36)).join("");

  // ---------- state ----------
  const rawE = new URLSearchParams(location.search).get("e");
  let EVENT = rawE && /^[A-Za-z0-9_-]{1,40}$/.test(rawE) ? rawE : null;
  const nameKey = () => "yt-name-" + EVENT;

  let db = null, uid = null, authOk = false;
  let ev = null;              // event doc: {title, details, groupSize, owner, adminName}
  let evMissing = false;
  let people = {};            // id -> {name, dates:[]}
  let meId = null, meName = null;
  let myDates = new Set();
  let dirty = false;
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let focusKey = null;
  const isAdmin = () => !!ev; // everyone in the group can edit the event info

  function idFor(name){
    const bytes = new TextEncoder().encode(name.trim().toLowerCase());
    return "p-" + Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
  }

  // Pastel palette: each person gets their own colour (unique while there are colours left).
  const PASTELS = ["#FFB3BA","#BAE1FF","#BAFFC9","#FFF3B0","#D7BAFF","#FFD6A5","#A0E7E5","#F1C0E8",
                   "#C7CEEA","#E2F0CB","#FBC4AB","#B5EAD7","#FFC8E8","#CFBAF0","#D4E09B","#9ED8F5"];
  const hashOf = id => { let h=0; for (const c of id) h=(h*31+c.charCodeAt(0))>>>0; return h; };
  let colorMap = {};
  function assignColors(ids){
    const map = {}, used = new Set();
    for (const id of [...ids].sort()) {
      let slot = hashOf(id) % PASTELS.length, tries = 0;
      while (used.has(slot) && tries < PASTELS.length) { slot = (slot+1) % PASTELS.length; tries++; }
      if (tries < PASTELS.length) { used.add(slot); map[id] = PASTELS[slot]; }
      else map[id] = `hsl(${(hashOf(id)*137.5)%360} 75% 82%)`;
    }
    colorMap = map;
  }
  const colorFor = id => colorMap[id] || PASTELS[hashOf(id) % PASTELS.length];
  const initial = n => esc(Array.from(n.trim())[0] || "?").toUpperCase();
  const avatar = p => `<span class="av" style="background:${colorFor(p.id)}">${initial(p.name)}</span>`;

  function allPeople(){
    const map = {...people};
    if (meId) map[meId] = { name: meName, dates: [...myDates] };
    return Object.entries(map)
      .filter(([,p]) => p && p.name)
      .map(([id,p]) => ({ id, name:String(p.name), dates:new Set(Array.isArray(p.dates)?p.dates:[]) }))
      .sort((x,y)=>x.name.localeCompare(y.name));
  }
  function counts(list){
    const c = {};
    for (const p of list) for (const d of p.dates) (c[d] ||= []).push(p);
    return c;
  }
  const groupSize = () => ev ? clampSize(ev.groupSize) : 5;
  const effSize = list => Math.max(groupSize(), list.filter(p=>p.dates.size>0).length, 1);

  // ---------- render ----------
  function applyStatic(){
    document.documentElement.lang = lang === "zh" ? "zh-HK" : "en";
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
    $("langBtn").textContent = t("lang");
    $("nameInput").placeholder = t("namePh");
    $("evAdmin").placeholder = t("namePh");
    $("evTitle").placeholder = t("titlePh");
    $("evDetails").placeholder = t("detailsPh");
    const fmt = new Intl.DateTimeFormat(locale(), { weekday:"short" });
    $("dow").innerHTML = Array.from({length:7},(_,i)=>`<div class="dow">${esc(fmt.format(new Date(2023,0,1+i)))}</div>`).join("");
    if (lastNotice) notice(lastNotice.key, lastNotice.action);
  }

  function render(){
    const list = allPeople();
    assignColors(list.map(p=>p.id));
    const c = counts(list);
    const size = effSize(list);
    const admin = isAdmin();

    // header
    $("titleText").textContent = ev ? (ev.title || "") : (EVENT ? "" : t("createTitle"));
    document.title = (ev && ev.title ? ev.title + " · " : "") + "約時間 · Find a Day";
    const details = ev && typeof ev.details === "string" ? ev.details.trim() : "";
    $("detailsText").hidden = !details;
    $("detailsText").textContent = details;
    $("metaLine").hidden = !ev;
    $("organiser").textContent = ev && ev.adminName ? t("organisedBy", ev.adminName) : "";
    $("editBtn").hidden = !admin;
    $("copyBtn").hidden = !ev;
    $("adminBadge").hidden = true;
    $("mePill").hidden = !meName;
    $("meName").textContent = meName || "";

    // group size
    $("stepper").hidden = !admin;
    $("sizePill").hidden = !ev;
    $("sizeStatic").hidden = admin;
    $("sizeStatic").textContent = t("people", groupSize());
    if (document.activeElement !== $("size")) $("size").value = groupSize();

    $("monthLabel").textContent = new Intl.DateTimeFormat(locale(), { year:"numeric", month:"long" }).format(view);

    // calendar
    const first = new Date(view.getFullYear(), view.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    let html = "";
    for (let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      if (i===35 && d.getMonth() !== view.getMonth()) break;
      const k = keyOf(d);
      const ps = c[k] || [];
      const n = ps.length;
      const cls = ["day"];
      if (d.getMonth() !== view.getMonth()) cls.push("out");
      if (d < today) cls.push("past");
      if (k === todayKey) cls.push("today");
      if (myDates.has(k)) cls.push("mine");
      if (n>0 && n>=size) cls.push("full");
      if (k === focusKey) cls.push("focus");
      const dots = n ? `<span class="dots">${ps.slice(0,10).map(p=>`<i style="background:${colorFor(p.id)}" title="${esc(p.name)}"></i>`).join("")}${n>10?`<em>+${n-10}</em>`:""}</span>` : "";
      html += `<button class="${cls.join(" ")}" data-k="${k}" aria-pressed="${myDates.has(k)}" aria-label="${k}: ${n}/${size}">
        <span><span class="num">${d.getDate()}</span></span>
        <span class="bottom">${dots}<span class="cnt">${n?`${n}/${size}`:""}</span></span></button>`;
    }
    $("grid").innerHTML = html;

    // responded
    const respondedN = list.filter(p=>p.dates.size>0).length;
    $("responded").textContent = t("responded", respondedN, size);

    // top 3 days (today onward)
    const ranked = Object.entries(c)
      .filter(([k]) => k >= todayKey)
      .sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
      .slice(0,3);
    const dfmt = new Intl.DateTimeFormat(locale(), { weekday:"short", day:"numeric", month:"short" });
    $("rank").innerHTML = ranked.length ? ranked.map(([k,ps],i)=>`
      <li><button data-k="${k}" class="${k===focusKey?"sel":""}">
        <span class="pos">${i+1}</span>
        <span><div class="date">${esc(dfmt.format(parseKey(k)))}</div>
          <div class="bar"><i style="width:${Math.min(100,ps.length/size*100)}%"></i></div></span>
        <span class="n">${ps.length}<small>/${size}</small>${ps.length>=size?" ★":""}</span>
      </button></li>`).join("")
      : `<li class="empty">${esc(t("noData"))}</li>`;

    renderDetail(list, c, size);

    // people
    const adminId = ev && ev.adminName ? idFor(ev.adminName) : null;
    $("people").innerHTML = list.length ? list.map(p=>`
      <span class="chip ${p.dates.size?"":"off"} ${p.id===meId?"me":""}" title="${esc(t("picked",p.dates.size))}">
        ${avatar(p)}${esc(p.name)}${p.id===adminId?` <span class="badge">${esc(t("admin"))}</span>`:""}
        <small style="color:var(--muted)">${p.dates.size}</small></span>`).join("")
      : `<span class="empty">${esc(t("nobody"))}</span>`;

    const canAct = !!(meId && ev && authOk);
    $("clearBtn").disabled = $("removeBtn").disabled = !canAct;
    updateSubmit();
  }

  function renderDetail(list, c, size){
    list ||= allPeople(); c ||= counts(list); size ||= effSize(list);
    if (!focusKey){ $("detail").innerHTML = `<div class="empty">${esc(t("hoverHint"))}</div>`; return; }
    const free = c[focusKey] || [];
    const freeIds = new Set(free.map(p=>p.id));
    const not = list.filter(p=>!freeIds.has(p.id));
    const dfmt = new Intl.DateTimeFormat(locale(), { weekday:"long", day:"numeric", month:"long" });
    const chip = (p,off) => `<span class="chip ${off?"off":""}">${avatar(p)}${esc(p.name)}</span>`;
    $("detail").innerHTML = `
      <div class="detail-h">${esc(dfmt.format(parseKey(focusKey)))} · ${free.length}/${size}</div>
      ${free.length && free.length>=size ? `<div style="font-weight:600;font-size:14px">🎉 ${esc(t("allFree"))}</div>`:""}
      <div class="lbl">${esc(t("free"))}</div>
      <div class="names">${free.length?free.map(p=>chip(p,false)).join(""):`<span class="empty">—</span>`}</div>
      <div class="lbl">${esc(t("notFree"))}</div>
      <div class="names">${not.length?not.map(p=>chip(p,true)).join(""):`<span class="empty">—</span>`}</div>`;
  }

  // ---------- status / notices ----------
  let statusTimer, lastNotice = null;
  function setStatus(k){ clearTimeout(statusTimer); $("status").textContent = k ? t(k) : ""; if (k==="saved") statusTimer = setTimeout(()=>$("status").textContent="",2000); }
  function notice(k, action){
    lastNotice = k ? { key:k, action } : null;
    const n = $("notice");
    if (!k){ n.classList.remove("show"); return; }
    $("noticeText").textContent = t(k);
    const b = $("noticeBtn");
    b.hidden = !action;
    if (action) { b.textContent = t(action.label); b.onclick = action.run; }
    n.classList.add("show");
  }

  // ---------- writes ----------
  let saveTimer = null, writing = Promise.resolve();
  // Picks stay on this device until the person taps Submit.
  function updateSubmit(){
    const b = $("submitBtn");
    if (b.classList.contains("done") && !dirty) return;
    b.classList.remove("done");
    b.textContent = t("submit");
    b.disabled = !(dirty && meId && ev && authOk);
  }
  function markChanged(){ dirty = true; render(); }
  $("submitBtn").onclick = () => {
    if (!dirty) return;
    const b = $("submitBtn");
    b.disabled = true; b.textContent = t("saving");
    saveMine(() => { b.classList.add("done"); b.textContent = t("submitted"); setTimeout(() => { b.classList.remove("done"); updateSubmit(); }, 2500); },
             () => { b.textContent = t("submit"); b.disabled = false; });
  };
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  // Adds the person to the list (with no new picks) without submitting anything.
  function registerMe(){
    if (!db || !meId || !ev || !authOk) return;
    const id = meId, body = { name: meName, dates: dirty ? [] : [...myDates].sort(), updated: new Date().toISOString() };
    writing = writing.then(() => setDoc(doc(db, "events", EVENT, "people", id), body)).catch(e => console.error(e));
  }

  function scheduleSave(){
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveMine, 600);
  }
  function saveMine(onOk, onFail){
    saveTimer = null;
    if (!db || !meId || !ev || !authOk) { if (onFail) onFail(); return; }
    const body = { name: meName, dates: [...myDates].sort(), updated: new Date().toISOString() };
    const id = meId;
    setStatus("saving");
    writing = writing.then(() => setDoc(doc(db, "events", EVENT, "people", id), body))
      .then(() => { dirty = saveTimer !== null; setStatus("saved"); if (onOk) onOk(); render(); })
      .catch(e => { handleWriteErr(e); dirty = true; if (onFail) onFail(); });
  }
  function handleWriteErr(e){
    dirty = false;
    console.error(e);
    if (e && e.code === "resource-exhausted") notice("full");
    setStatus("saveErr");
  }
  let evTimer = null, evPending = {};
  function saveEvent(fields, immediate){
    Object.assign(evPending, fields);
    clearTimeout(evTimer);
    const run = () => {
      const f = evPending; evPending = {};
      if (!db || !isAdmin()) return Promise.resolve();
      setStatus("saving");
      return (writing = writing.then(() => updateDoc(doc(db, "events", EVENT), f))
        .then(() => setStatus("saved")).catch(handleWriteErr));
    };
    if (immediate) return run();
    evTimer = setTimeout(run, 500);
  }

  // ---------- identity ----------
  function setMe(name, opts={}){
    name = name.trim().slice(0,24);
    if (!name) return;
    meName = name; meId = idFor(name);
    const existing = people[meId];
    myDates = new Set(existing && Array.isArray(existing.dates) ? existing.dates : []);
    ls.set(nameKey(), name);
    ls.set("yt-last-name", name);
    $("nameModal").classList.remove("show");
    render();
    if (!existing && !opts.noSave && db && ev) registerMe(); // add to the "Who's in" list
  }
  function openNameModal(){
    $("nameInput").value = meName ? "" : (ls.get("yt-last-name") || "");
    const list = Object.entries(people).filter(([,p])=>p&&p.name).map(([id,p])=>({id,name:String(p.name)}));
    assignColors(list.map(p=>p.id));
    $("existingWrap").hidden = !list.length;
    $("existing").innerHTML = list.map(p=>`<button type="button" class="chip" data-name="${esc(p.name)}">${avatar(p)}${esc(p.name)}</button>`).join("");
    $("nameModal").classList.add("show");
    setTimeout(()=>$("nameInput").focus(), 50);
  }

  // ---------- create / edit event ----------
  let evMode = "create";
  function openEventModal(mode){
    evMode = mode;
    const editing = mode === "edit";
    $("evHeading").textContent = t(editing ? "editTitle" : "createTitle");
    $("evHint").textContent = t(editing ? "editHint" : "createHint");
    $("evNameField").hidden = editing;
    $("evCancel").hidden = !editing;
    $("evSubmit").textContent = t(editing ? "save" : "create");
    $("evSubmit").disabled = false;
    $("evErr").textContent = "";
    if (editing) {
      $("evTitle").value = ev.title || "";
      $("evDetails").value = ev.details || "";
      $("evSize").value = groupSize();
    } else {
      $("evAdmin").value = ls.get("yt-last-name") || "";
      $("evTitle").value = ""; $("evDetails").value = ""; $("evSize").value = 5;
    }
    $("eventModal").classList.add("show");
    setTimeout(()=>(editing || $("evAdmin").value ? $("evTitle") : $("evAdmin")).focus(), 50);
  }
  $("evMinus").onclick = () => $("evSize").value = clampSize(Number($("evSize").value)-1);
  $("evPlus").onclick = () => $("evSize").value = clampSize(Number($("evSize").value)+1);
  $("evCancel").onclick = () => $("eventModal").classList.remove("show");
  $("eventForm").addEventListener("submit", async e => {
    e.preventDefault();
    const admin = $("evAdmin").value.trim().slice(0,24);
    const title = $("evTitle").value.trim().slice(0,60);
    const details = $("evDetails").value.trim().slice(0,1000);
    const size = clampSize($("evSize").value);
    if (evMode === "create" && !admin) { $("evErr").textContent = t("needName"); $("evAdmin").focus(); return; }
    if (!title) { $("evErr").textContent = t("needTitle"); $("evTitle").focus(); return; }

    if (evMode === "edit") {
      ev = { ...ev, title, details, groupSize: size };
      $("eventModal").classList.remove("show");
      render();
      saveEvent({ title, details, groupSize: size }, true);
      return;
    }

    if (!db || !authOk) { $("evErr").textContent = t(lastNotice ? lastNotice.key : "createFail"); return; }
    $("evSubmit").disabled = true; $("evSubmit").textContent = t("creating"); $("evErr").textContent = "";
    const id = newEventId();
    const body = { title, details, groupSize: size, adminName: admin, created: new Date().toISOString() };
    try {
      await setDoc(doc(db, "events", id), body);
      EVENT = id;
      try { history.replaceState(null, "", location.pathname + "?e=" + id); } catch (err) {}
      ev = body; evMissing = false;
      $("eventModal").classList.remove("show");
      setMe(admin);
      subscribe();
      notice("newCreated");
    } catch (err) {
      console.error(err);
      $("evSubmit").disabled = false; $("evSubmit").textContent = t("create");
      $("evErr").textContent = t("createFail");
    }
  });
  $("editBtn").onclick = () => { if (isAdmin()) openEventModal("edit"); };

  // ---------- interactions ----------
  let drag = null;
  function toggleDay(k, mode){
    if (!ev) return;
    if (!meId) { openNameModal(); return; }
    if (k < todayKey) return;
    const has = myDates.has(k);
    const want = mode ?? !has;
    if (want === has) return;
    want ? myDates.add(k) : myDates.delete(k);
    focusKey = k;
    markChanged();
  }
  $("grid").addEventListener("pointerdown", e => {
    const b = e.target.closest(".day"); if (!b) return;
    const k = b.dataset.k;
    if (k < todayKey || !ev) { focusKey = k; render(); return; }
    const mode = !myDates.has(k);
    toggleDay(k, mode);
    if (e.pointerType === "mouse") drag = { mode };
  });
  $("grid").addEventListener("pointerover", e => {
    const b = e.target.closest(".day"); if (!b) return;
    if (drag) toggleDay(b.dataset.k, drag.mode);
    else if (e.pointerType === "mouse" && b.dataset.k !== focusKey) {
      focusKey = b.dataset.k;
      document.querySelectorAll(".day.focus").forEach(x=>x.classList.remove("focus"));
      b.classList.add("focus");
      renderDetail();
    }
  });
  window.addEventListener("pointerup", () => drag = null);
  $("grid").addEventListener("keydown", e => {
    const b = e.target.closest(".day"); if (!b) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDay(b.dataset.k); }
  });
  $("rank").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    focusKey = b.dataset.k;
    const d = parseKey(focusKey); view = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
    if (window.innerWidth <= 900) $("detailCard").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); };
  $("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); };
  $("todayBtn").onclick = () => { view = new Date(today.getFullYear(), today.getMonth(), 1); render(); };
  $("langBtn").onclick = () => { lang = lang==="en"?"zh":"en"; ls.set("yt-lang", lang); applyStatic(); render(); };
  $("switchBtn").onclick = () => { dirty = false; meId = meName = null; myDates = new Set(); ls.del(nameKey()); render(); openNameModal(); };
  $("nameForm").addEventListener("submit", e => { e.preventDefault(); setMe($("nameInput").value); });
  $("existing").addEventListener("click", e => { const b = e.target.closest("[data-name]"); if (b) setMe(b.dataset.name); });
  $("newBtn").onclick = () => { location.href = location.pathname; };
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $("copyBtn").textContent = t("copied"); if (lastNotice && lastNotice.key === "newCreated") notice(null); }
    catch(e) { window.prompt("Copy this link:", location.href); }
    setTimeout(() => $("copyBtn").textContent = t("copyLink"), 2000);
  };

  $("clearBtn").onclick = () => { if (!myDates.size) return; myDates.clear(); markChanged(); };
  let removeArmed = null;
  $("removeBtn").onclick = () => {
    if (!meId) return;
    if (!removeArmed) {
      $("removeBtn").textContent = t("confirmRemove");
      removeArmed = setTimeout(() => { removeArmed=null; $("removeBtn").textContent = t("removeMe"); }, 3000);
      return;
    }
    clearTimeout(removeArmed); removeArmed = null; $("removeBtn").textContent = t("removeMe");
    clearTimeout(saveTimer); saveTimer = null; dirty = false;
    const id = meId;
    delete people[id];
    meId = meName = null; myDates = new Set(); ls.del(nameKey());
    if (db) writing = writing.then(()=>deleteDoc(doc(db, "events", EVENT, "people", id))).catch(handleWriteErr);
    render(); openNameModal();
  };

  // admin group-size stepper
  function setSize(n){
    if (!isAdmin()) return;
    n = clampSize(n);
    if (n === groupSize()) { $("size").value = n; return; }
    ev = { ...ev, groupSize: n }; render(); saveEvent({ groupSize: n });
  }
  $("minus").onclick = () => setSize(groupSize()-1);
  $("plus").onclick = () => setSize(groupSize()+1);
  $("size").addEventListener("change", () => setSize($("size").value));

  // ---------- live data ----------
  let subscribed = false;
  function subscribe(){
    if (subscribed || !db || !EVENT) return;
    subscribed = true;
    let slow = setTimeout(() => notice("slow"), 10000);
    let gotPeople = false, gotEvent = false;
    const clearSlow = () => { clearTimeout(slow); if (lastNotice && lastNotice.key === "slow") notice(null); };

    onSnapshot(doc(db, "events", EVENT), snap => {
      const firstTime = !gotEvent;
      gotEvent = true;
      if (!snap.exists()) {
        if (snap.metadata.fromCache) return;
        evMissing = true; ev = null; clearSlow();
        notice("notFound", { label:"createNew", run:() => { location.href = location.pathname; } });
        render(); return;
      }
      ev = snap.data(); evMissing = false;
      if (!snap.metadata.fromCache) clearSlow();
      render();
      if (firstTime && !meName) openNameModal();
    }, e => { console.error(e); clearTimeout(slow); notice("slow"); });

    onSnapshot(collection(db, "events", EVENT, "people"), snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v) next[d.id] = v; });
      people = next;
      if (meId && !dirty) {
        const mine = people[meId];
        if (mine && Array.isArray(mine.dates)) myDates = new Set(mine.dates);
        else if (!mine && !gotPeople && !snap.metadata.fromCache && ev) registerMe();
      }
      if (!snap.metadata.fromCache) gotPeople = true;
      render();
      if ($("nameModal").classList.contains("show")) {
        const typed = $("nameInput").value; openNameModal(); $("nameInput").value = typed;
      }
    }, e => { console.error(e); });
  }

  // ---------- boot ----------
  applyStatic();
  if (EVENT) {
    const saved = ls.get(nameKey());
    if (saved) { meName = saved; meId = idFor(saved); }
  }
  render();

  let firebaseConfig = null, setupErr = null;
  try {
    firebaseConfig = (await import("./config.js")).firebaseConfig;
  } catch (e) { console.error(e); setupErr = "configBroken"; }
  if (!setupErr && (!firebaseConfig || !firebaseConfig.projectId || String(firebaseConfig.apiKey||"").startsWith("PASTE"))) setupErr = "notSetUp";
  if (!setupErr) {
    try {
      ({ initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"));
      ({ getFirestore, doc, collection, setDoc, updateDoc, deleteDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"));
    } catch (e) { console.error(e); setupErr = "fbLoad"; }
  }

  if (setupErr) {
    notice(setupErr);
    if (!EVENT) openEventModal("create");
  } else {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    authOk = true;
    if (EVENT) subscribe();
    else openEventModal("create");
    render();
  }
}
</script>
</body>
</html>
